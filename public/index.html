<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>运动打卡</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>运动打卡</h1>
          <p id="statusText">正在检查数据连接...</p>
        </div>
        <label class="access-code" id="accessCodeWrap" hidden>
          <span>活动口令</span>
          <input id="accessCode" type="password" autocomplete="current-password" placeholder="输入口令">
        </label>
        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="checkin" type="button">每日打卡</button>
          <button class="tab" data-tab="weight" type="button">体重记录</button>
          <button class="tab" data-tab="report" type="button">周报</button>
        </div>
      </header>

      <section class="panel active" id="checkin">
        <form id="checkinForm" class="form-grid">
          <label>
            <span>成员</span>
            <input name="member" autocomplete="name" required placeholder="填写姓名">
          </label>
          <label>
            <span>日期</span>
            <input name="date" type="date" required>
          </label>
          <label>
            <span>打卡时间</span>
            <input name="time" type="time" required>
          </label>
          <label>
            <span>打卡形式</span>
            <select name="activity">
              <option>跑步</option>
              <option>快走</option>
              <option>骑行</option>
              <option>游泳</option>
              <option>力量训练</option>
              <option>瑜伽拉伸</option>
              <option>其他</option>
            </select>
          </label>
          <label>
            <span>运动时长（分钟）</span>
            <input name="duration" type="number" min="0" step="1" required placeholder="45">
          </label>
          <label>
            <span>距离（公里）</span>
            <input name="distance" type="number" min="0" step="0.01" placeholder="5.20">
          </label>
          <label>
            <span>强度</span>
            <select name="intensity">
              <option>轻松</option>
              <option selected>适中</option>
              <option>高强度</option>
            </select>
          </label>
          <label>
            <span>打卡照片</span>
            <input name="photo" type="file" accept="image/*">
          </label>
          <label class="wide">
            <span>备注</span>
            <textarea name="note" rows="3" placeholder="可写今日状态、路线、饮食备注等"></textarea>
          </label>
          <button class="primary" type="submit">提交打卡</button>
        </form>
      </section>

      <section class="panel" id="weight">
        <form id="weightForm" class="form-grid">
          <label>
            <span>成员</span>
            <input name="member" autocomplete="name" required placeholder="填写姓名">
          </label>
          <label>
            <span>月份</span>
            <input name="month" type="month" required>
          </label>
          <label>
            <span>记录类型</span>
            <select name="period">
              <option value="start">月初</option>
              <option value="end">月末</option>
            </select>
          </label>
          <label>
            <span>体重（公斤）</span>
            <input name="weightKg" type="number" min="0" step="0.1" required placeholder="72.5">
          </label>
          <label>
            <span>测量时间</span>
            <input name="measuredAt" type="datetime-local" required>
          </label>
          <label class="wide">
            <span>备注</span>
            <textarea name="note" rows="3" placeholder="可写空腹、饭后、称重条件等"></textarea>
          </label>
          <button class="primary" type="submit">保存体重</button>
        </form>
      </section>

      <section class="panel" id="report">
        <div class="report-toolbar">
          <label>
            <span>周一日期</span>
            <input id="weekStart" type="date">
          </label>
          <button class="secondary" id="refreshReport" type="button">刷新周报</button>
        </div>

        <div class="metrics">
          <article>
            <strong id="totalCheckins">0</strong>
            <span>本周打卡</span>
          </article>
          <article>
            <strong id="totalDuration">0</strong>
            <span>累计分钟</span>
          </article>
          <article>
            <strong id="totalDistance">0</strong>
            <span>累计公里</span>
          </article>
          <article>
            <strong id="totalMembers">0</strong>
            <span>成员数</span>
          </article>
        </div>

        <div class="report-grid">
          <section>
            <h2>成员汇总</h2>
            <div id="memberRows" class="rows"></div>
          </section>
          <section>
            <h2>月度减重</h2>
            <div id="lossRows" class="rows"></div>
          </section>
          <section>
            <h2>最近打卡</h2>
            <div id="latestRows" class="rows"></div>
          </section>
          <section>
            <h2>本周未打卡</h2>
            <div id="missingRows" class="rows"></div>
          </section>
        </div>
      </section>

      <div id="toast" class="toast" hidden></div>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
